name: Sync adventure from upstream

# Copies one adventure plus the shared lib/ from off-on-dev/open-source-challenges
# and opens a PR. Content is copied verbatim: the only change is one added key per
# devcontainer.json, for Dynatrace usage tracking.
#
# Upstream's legacy numbered slugs (01-* .. 05-*) are accepted and land here with
# the NN- prefix stripped, path references inside the copied files repointed to
# match — see .github/scripts/sync-adventure.sh, and README.md for how to run this.

on:
  workflow_dispatch:
    inputs:
      adventure:
        description: "Upstream adventure slug, e.g. dead-reckoning or 01-echoes-lost-in-orbit"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: off-on-dev/open-source-challenges

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Clone upstream at main
        run: |
          git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" "${RUNNER_TEMP}/upstream"

      - name: Sync adventure
        id: sync
        # Passed through the environment rather than interpolated into the script,
        # so a crafted input cannot inject shell.
        env:
          ADVENTURE: ${{ inputs.adventure }}
        run: |
          chmod +x .github/scripts/sync-adventure.sh
          .github/scripts/sync-adventure.sh "$ADVENTURE" "${RUNNER_TEMP}/upstream" .

      - name: Check for changes
        id: diff
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Already in sync
        if: steps.diff.outputs.changed == 'false'
        env:
          ADVENTURE: ${{ inputs.adventure }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          echo "✅ '$ADVENTURE' is already in sync with upstream ${UPSTREAM_SHA:0:8} — nothing to do."

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        id: push
        env:
          ADVENTURE: ${{ inputs.adventure }}
          LOCAL_SLUG: ${{ steps.sync.outputs.local_slug }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          branch="sync/${LOCAL_SLUG}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -A
          git commit -m "chore: sync ${LOCAL_SLUG} from upstream ${UPSTREAM_SHA:0:8}"

          # Force-pushed so re-running replaces the branch rather than stacking
          # commits on a stale sync.
          git push --force origin "HEAD:refs/heads/${branch}"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADVENTURE: ${{ inputs.adventure }}
          LOCAL_SLUG: ${{ steps.sync.outputs.local_slug }}
          BRANCH: ${{ steps.push.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          PREVIOUS_SHA: ${{ steps.sync.outputs.previous_sha }}
          DISPLAY_NAME: ${{ steps.sync.outputs.display_name }}
          DEVCONTAINERS: ${{ steps.sync.outputs.devcontainers }}
        run: |
          upstream_url="https://github.com/${UPSTREAM_REPO}"
          if [[ -n "$PREVIOUS_SHA" ]]; then
            range_line="Changes since last sync: ${upstream_url}/compare/${PREVIOUS_SHA}...${UPSTREAM_SHA}"
          else
            range_line="First sync of this adventure. Upstream tree: ${upstream_url}/tree/${UPSTREAM_SHA}"
          fi

          {
            echo "Synced \`${ADVENTURE}\` (${DISPLAY_NAME}) from [\`${UPSTREAM_REPO}\`](${upstream_url}) at \`${UPSTREAM_SHA}\`."
            echo
            echo "$range_line"
            if [[ "$LOCAL_SLUG" != "$ADVENTURE" ]]; then
              echo
              echo "⚠️ **Renamed on the way in.** \`${ADVENTURE}\` is one of upstream's numbered slugs, so it"
              echo "lands here as \`${LOCAL_SLUG}\` — matching the hand-copied \`lex-imperfecta\`, which is also"
              echo "published unprefixed."
            fi
            echo
            echo "## Paths replaced"
            echo
            echo "- \`adventures/${LOCAL_SLUG}/\`"
            for dc in $DEVCONTAINERS; do
              echo "- \`.devcontainer/${dc}/\`"
            done
            echo "- \`lib/\` (shared)"
            echo
            echo "## Transform applied"
            echo
            echo "Every level's \`devcontainer.json\` has \`remoteEnv.OFFON_EXTERNAL_SOURCE\` set to"
            echo "\`dynatrace-community\`."
            if [[ "$LOCAL_SLUG" != "$ADVENTURE" ]]; then
              echo
              echo "Because this adventure was renamed, the \`adventures/${ADVENTURE}\` and"
              echo "\`.devcontainer/${ADVENTURE}_*\` path references inside the copied files were repointed"
              echo "at the new locations. Those paths are load-bearing: the ArgoCD ApplicationSets in each"
              echo "level's \`manifests/appset.yaml\` and the \`sed\`/\`kubectl\` lines in \`post-start.sh\`"
              echo "would otherwise address a directory that does not exist here."
              echo
              echo "Only those two path prefixes were touched. The bare slug is left alone wherever else it"
              echo "appears — notably the community thread URLs in the docs, which keep the numbered form."
              echo
              echo "Each level's \`devcontainer.json\` \`name\` was also relabelled, swapping the \`Adventure NN\`"
              echo "token for the adventure's name so the levels read like the unnumbered adventures do."
            else
              echo "Everything else is byte-for-byte upstream."
            fi
            echo
            echo "## Review notes"
            echo
            echo "⚠️ **Check the \`lib/\` diff.** \`lib/\` is shared by every adventure, so changes here"
            echo "can affect adventures other than this one — including ones already live. Confirm that"
            echo "helpers used by other adventures' \`verify.sh\` and \`post-create.sh\` still exist with"
            echo "compatible signatures."
            if [[ "$LOCAL_SLUG" != "$ADVENTURE" ]]; then
              echo
              echo "⚠️ **Check the rename.** Confirm no \`${ADVENTURE}\` path reference survives, and that the"
              echo "relabelled level names read correctly in the Codespaces picker."
            fi
            echo
            echo "Content fixes belong upstream, not in this repo — see \`README.md\`."
          } > "${RUNNER_TEMP}/pr-body.md"

          title="chore: sync ${ADVENTURE} from upstream"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "🔁 Updated existing PR #${existing}"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "$title" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
